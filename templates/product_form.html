{% extends "base.html" %}{% block content %}
<section class="hero compact"><div><p class="eyebrow">INVENTORY MANAGEMENT</p><h1>{{ title }}</h1><p>Enter product details. Fields marked * are required.</p></div></section>
<section class="panel form-panel"><form method="post" class="product-form">
<div class="form-grid">
<label>SKU *<input name="sku" required maxlength="80" value="{{ product.sku if product else '' }}" placeholder="e.g. TOY-CAR-001"></label>
<label>Product name *<input name="name" required maxlength="160" value="{{ product.name if product else '' }}" placeholder="e.g. Remote control car"></label>
<label>Category<input name="category" value="{{ product.category if product else '' }}" placeholder="e.g. Toys"></label>
<label>Supplier<input name="supplier" value="{{ product.supplier if product else '' }}" placeholder="Supplier name"></label>
<label>Purchase cost (₹)<input type="number" name="purchase_cost" min="0" step="0.01" required value="{{ product.purchase_cost if product else '0' }}"></label>
<label>Selling price (₹)<input type="number" name="selling_price" min="0" step="0.01" required value="{{ product.selling_price if product else '0' }}"></label>
<label>Current stock<input type="number" name="stock" min="0" step="1" required value="{{ product.stock if product else '0' }}"></label>
<label>Reorder level<input type="number" name="reorder_level" min="0" step="1" required value="{{ product.reorder_level if product else '0' }}"></label>
</div>
<div class="form-actions"><a class="text-link" href="{{ url_for('products.products_page') }}">Cancel</a><button type="submit">Save product</button></div>
</form></section>{% endblock %}
